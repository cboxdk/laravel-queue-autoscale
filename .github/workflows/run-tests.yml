name: run-tests

on:
  push:
    paths:
      - "**.php"
      - ".github/workflows/run-tests.yml"
      - "phpunit.xml.dist"
      - "composer.json"
      - "composer.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: [8.5, 8.4]
        laravel: [13.*, 12.*]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 13.*
            testbench: 11.*
          - laravel: 12.*
            testbench: 10.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo, redis
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --ci --exclude-group=simulation
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_AVAILABLE: true

      # The simulation suite holds the strongest end-to-end assertions in the
      # repo — whole outages and traffic ramps driven through the real engine —
      # and takes about eighteen minutes, so it is excluded from the matrix
      # above and run once rather than on every leg.
      - name: Run simulation suite
        if: matrix.php == '8.4' && matrix.laravel == '13.*' && matrix.stability == 'prefer-stable'
        run: vendor/bin/pest --ci --group=simulation

  # The redis group covers the cluster-safety paths (keyless ping, multi-key
  # EVALs). The matrix above already runs it against a single node as the
  # regression guard; this job reruns just that group against a real 3-master
  # cluster, which is where the CROSSSLOT and keyless-PING rules actually bite.
  test-with-redis-cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        include:
          - php: 8.4
            laravel: 13.*
            testbench: 11.*

    name: Redis Cluster - P${{ matrix.php }} - L${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo, redis
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Create Redis Cluster
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing redis-server
          sudo service redis-server stop
          redis-server --daemonize yes --port 7000 --appendonly yes --cluster-enabled yes --cluster-config-file nodes-7000.conf
          redis-server --daemonize yes --port 7001 --appendonly yes --cluster-enabled yes --cluster-config-file nodes-7001.conf
          redis-server --daemonize yes --port 7002 --appendonly yes --cluster-enabled yes --cluster-config-file nodes-7002.conf
          redis-cli --cluster create 127.0.0.1:7000 127.0.0.1:7001 127.0.0.1:7002 --cluster-replicas 0 --cluster-yes

      # `--cluster create` returns once slots are assigned, but cluster_state
      # only flips to ok after the nodes agree, a moment later. Checking once
      # immediately is a race, so poll each node until it is ready.
      - name: Check Redis Cluster is ready
        run: |
          for port in 7000 7001 7002; do
            for attempt in $(seq 1 30); do
              if redis-cli -c -h 127.0.0.1 -p "$port" cluster info | grep -q "cluster_state:ok"; then
                echo "node $port ready after ${attempt} attempt(s)"
                continue 2
              fi
              sleep 1
            done
            echo "node $port never reached cluster_state:ok" >&2
            redis-cli -c -h 127.0.0.1 -p "$port" cluster info >&2
            exit 1
          done

      - name: Execute cluster integration tests
        run: vendor/bin/pest --ci --group=redis
        env:
          REDIS_CLUSTER_HOSTS_AND_PORTS: 127.0.0.1:7000,127.0.0.1:7001,127.0.0.1:7002
          REDIS_AVAILABLE: true
